server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the API container so the browser never needs a
    # cross-origin (CORS) request and the auth cookie stays first-party.
    location /api/ {
        proxy_pass http://api:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router history mode: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
