name: tsibroker

services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: tsibroker-api
    environment:
      ASPNETCORE_HTTP_PORTS: "8081"
      AdminUser__Username: ${ADMIN_USERNAME:-sa}
      AdminUser__Password: ${ADMIN_PASSWORD:-temp!}
    ports:
      - "8081:8081"
    volumes:
      - api_data:/app/data

  ui:
    build:
      context: ../src/TsiBroker.Ui
      dockerfile: Dockerfile
      args:
        VITE_THEME_COLOR: ${VITE_THEME_COLOR:-#23a8f2}
    container_name: tsibroker-ui
    ports:
      - "8080:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    container_name: tsibroker-postgres
    environment:
      POSTGRES_DB: tsibroker
      POSTGRES_USER: tsibroker
      POSTGRES_PASSWORD: devpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsibroker -d tsibroker"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: tsibroker-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: tsibroker
      MONGO_INITDB_ROOT_PASSWORD: devpassword123
      MONGO_INITDB_DATABASE: tsibroker
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  api_data:
  postgres_data:
  mongodb_data: