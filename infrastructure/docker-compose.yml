name: tsibroker

services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: tsibroker-api
    environment:
      ASPNETCORE_HTTP_PORTS: "8081"
      AdminUser__Username: ${ADMIN_USERNAME:-sa}
      AdminUser__Password: ${ADMIN_PASSWORD:-temp!}
    ports:
      - "8081:8081"
    volumes:
      - api_data:/app/data

  ui:
    build:
      # Build context is the repo root, not this project's own folder, because the
      # image now needs the @tsibroker/ui-kit workspace package (packages/tsibroker-ui-kit)
      # alongside it — see the Dockerfile's own comment for why.
      context: ..
      dockerfile: src/TsiBroker.Ui/Dockerfile
      args:
        VITE_THEME_COLOR: ${VITE_THEME_COLOR:-#23a8f2}
    container_name: tsibroker-ui
    ports:
      - "8080:80"
    depends_on:
      - api


  im-mock:
    profiles: ["im-mock"]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.im-mock
    container_name: tsibroker-im-mock
    environment:
      ASPNETCORE_HTTP_PORTS: "8081"
      AdminUser__Username: ${ADMIN_USERNAME:-sa}
      AdminUser__Password: ${ADMIN_PASSWORD:-temp!}
    ports:
      - "8091:8081"
    volumes:
      - im_mock_data:/app/data

  ru-mock:
    profiles: ["ru-mock"]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.ru-mock
    container_name: tsibroker-ru-mock
    environment:
      ASPNETCORE_HTTP_PORTS: "8081"
      AdminUser__Username: ${ADMIN_USERNAME:-sa}
      AdminUser__Password: ${ADMIN_PASSWORD:-temp!}
    ports:
      - "8092:8081"
    volumes:
      - ru_mock_data:/app/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tsibroker-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: tsibroker
      RABBITMQ_DEFAULT_PASS: devpassword123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "su-exec rabbitmq rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  api_data:
  im_mock_data:
  ru_mock_data:
  rabbitmq_data: